<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rewiring Leadership for Adding Value in the Age of AI | IMD &amp; DNV</title>
<meta name="description" content="Fill in the blanks and redefine your job as a leader. Download your card or share it on LinkedIn and X.">
<meta property="og:type" content="website">
<meta property="og:title" content="Rewiring Leadership for Adding Value in the Age of AI">
<meta property="og:description" content="Fill in the blanks and redefine your job as a leader. Part of IMD's Leading in the Age of AI Sprint.">
<meta property="og:url" content="https://murattarakci.github.io/DNV/">
<meta property="og:image" content="https://murattarakci.github.io/DNV/assets/og-card.png">
<meta property="og:image:width" content="1752">
<meta property="og:image:height" content="920">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://murattarakci.github.io/DNV/assets/og-card.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>
<script src="firebase-config.js"></script>
<style>
  :root {
    /* IMD brand guidelines v1.0 (Feb 2026): Midnight, Lac Léman Blue, Mist, Ecru */
    --imd-navy: #000A56;
    --imd-blue: #005DC4;
    --imd-light-blue: #D7EAF7;
    --imd-ecru: #F5F4EE;
    --imd-white: #FFFFFF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Public Sans", "Helvetica Neue", Arial, sans-serif;
    background: var(--imd-ecru);
    color: var(--imd-navy);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
  }

  .intro {
    max-width: 780px;
    text-align: center;
    margin-bottom: 28px;
  }
  .intro h1 {
    font-weight: 700;
    font-size: clamp(24px, 4vw, 34px);
    letter-spacing: -0.01em;
    margin-bottom: 10px;
  }
  .intro p {
    font-weight: 300;
    font-size: clamp(15px, 2vw, 18px);
    color: #3a4066;
  }
  .intro p strong { font-weight: 600; }

  /* ---------- The card (this is what gets exported) ---------- */
  .card-wrap {
    width: 100%;
    max-width: 840px;
  }

  #card {
    container-type: inline-size;
    width: 100%;
    aspect-ratio: 1200 / 630;
    background-color: var(--imd-navy);
    background-image: radial-gradient(rgba(255,255,255,0.22) 1.1px, transparent 1.1px);
    background-size: 26px 26px;
    background-position: 8px 8px;
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 4.6% 5%;
    box-shadow: 0 18px 50px rgba(0, 10, 86, 0.22);
  }

  .card-logo {
    width: 24.5%;
    min-width: 145px;
  }
  .card-logo svg { display: block; width: 100%; height: auto; }

  .statement {
    color: var(--imd-white);
    font-weight: 600;
    font-size: 6.4cqw;
    line-height: 1.18;
    letter-spacing: -0.01em;
    padding-top: 0.8em; /* keeps air below the logo; scales with the fitted font */
    padding-bottom: 2%;
  }

  .statement [contenteditable] {
    outline: none;
    border-radius: 3px;
  }
  .statement [contenteditable]:focus {
    background: rgba(255, 255, 255, 0.08);
  }

  .blank, .proc {
    color: #9FE1FF;
    padding: 0 0.1em;
    text-decoration: underline;
    text-decoration-color: rgba(255, 255, 255, 0.55);
    text-decoration-thickness: 0.07em;
    text-underline-offset: 0.18em;
  }
  /* while empty, show the classic blank line to type on */
  .blank:empty, .proc:empty {
    display: inline-block;
    min-width: 3.5em;
    text-align: center;
    text-decoration: none;
    border-bottom: 0.12em solid rgba(255, 255, 255, 0.55);
  }
  .blank:empty::before, .proc:empty::before {
    content: attr(data-ph);
    color: rgba(255, 255, 255, 0.32);
    font-weight: 300;
  }
  /* hide placeholder hints in the exported image */
  .exporting .blank:empty::before, .exporting .proc:empty::before { content: ""; }
  .exporting [contenteditable]:focus { background: transparent; }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 2%;
  }

  .byline {
    color: rgba(255, 255, 255, 0.9);
    font-weight: 400;
    font-size: 3.4cqw;
    letter-spacing: 0.02em;
    margin-top: 0.4em;
  }

  .card-program {
    color: rgba(255, 255, 255, 0.55);
    font-weight: 300;
    font-size: 2.1cqw;
    letter-spacing: 0.03em;
    white-space: nowrap;
    text-decoration: none;
  }
  .card-program:hover { color: rgba(255, 255, 255, 0.85); text-decoration: underline; }
  .byline .who {
    min-width: 6em;
    display: inline-block;
    outline: none;
  }
  .byline .who:empty::before {
    content: attr(data-ph);
    color: rgba(255, 255, 255, 0.45);
  }
  .exporting .byline .who:empty::before { content: ""; }

  /* ---------- Controls ---------- */
  .actions {
    display: flex;
    justify-content: center;
    margin-top: 22px;
  }

  .menu-wrap { position: relative; }

  .btn {
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    padding: 13px 24px;
    border-radius: 999px;
    cursor: pointer;
    border: 2px solid var(--imd-blue);
    background: var(--imd-blue);
    color: var(--imd-white);
    transition: transform 0.08s ease, box-shadow 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 9px;
  }
  .btn:hover { box-shadow: 0 6px 18px rgba(0, 93, 196, 0.35); }
  .btn:active { transform: scale(0.97); }
  .btn svg { width: 17px; height: 17px; flex: none; }
  .btn .chev { width: 13px; height: 13px; transition: transform 0.15s ease; }
  .btn[aria-expanded="true"] .chev { transform: rotate(180deg); }

  .menu {
    position: absolute;
    top: calc(100% + 10px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--imd-white);
    border-radius: 14px;
    box-shadow: 0 10px 34px rgba(0, 10, 86, 0.22);
    padding: 8px;
    min-width: 235px;
    z-index: 100;
  }
  .menu-item {
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    color: var(--imd-navy);
    background: none;
    border: none;
    border-radius: 9px;
    cursor: pointer;
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 11px;
    white-space: nowrap;
  }
  .menu-item:hover { background: var(--imd-light-blue); }
  .menu-item svg { width: 17px; height: 17px; flex: none; color: var(--imd-blue); }

  .fac-link {
    margin-top: 56px;
    font-size: 12px;
    font-weight: 300;
    color: rgba(0, 10, 86, 0.28);
    text-decoration: none;
  }
  .fac-link:hover { color: var(--imd-blue); }

  .toast {
    position: fixed;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--imd-navy);
    color: var(--imd-white);
    font-size: 14px;
    padding: 12px 22px;
    border-radius: 999px;
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
    box-shadow: 0 8px 24px rgba(0, 10, 86, 0.35);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 560px) {
    body { padding: 24px 12px 48px; }
    .actions { flex-direction: column; align-items: stretch; }
    .btn { justify-content: center; }
  }
</style>
</head>

<div class="toast" id="toast"></div>

<script>
(function () {
  const card = document.getElementById("card");
  const toast = document.getElementById("toast");
  const HASHTAGS = "#Leadership #IMD #AILeadershipSprint";
  const PROGRAM_URL = "https://www.imd.org/sprint/leadership-ai/";

  /* --- dropdown menu --- */
  const menuBtn = document.getElementById("btn-menu");
  const menu = document.getElementById("menu");
  function setMenu(open) {
    menu.hidden = !open;
    menuBtn.setAttribute("aria-expanded", String(open));
  }
  menuBtn.addEventListener("click", (e) => { e.stopPropagation(); setMenu(menu.hidden); });
  menu.addEventListener("click", () => setMenu(false));
  document.addEventListener("click", (e) => { if (!menu.hidden && !menu.contains(e.target)) setMenu(false); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") setMenu(false); });

  /* --- auto-fit: shrink the statement font when long text would overflow the card --- */
  const stmtEl = document.getElementById("statement");
  function fitText() {
    let size = 6.4; // cqw, the design size
    stmtEl.style.fontSize = size + "cqw";
    while (size > 3 && card.scrollHeight > card.clientHeight + 1) {
      size -= 0.2;
      stmtEl.style.fontSize = size.toFixed(1) + "cqw";
    }
  }
  window.addEventListener("resize", fitText);

  /* --- editing behaviour: single line, plain text only --- */
  document.querySelectorAll("[contenteditable]").forEach((el) => {
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); el.blur(); }
    });
    el.addEventListener("input", fitText);
    el.addEventListener("paste", (e) => {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData("text/plain");
      document.execCommand("insertText", false, text.replace(/\s+/g, " "));
    });
  });

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove("show"), 3200);
  }

  function statementText() {
    const parts = [];
    document.querySelectorAll("#statement > span").forEach((s) => {
      const t = s.textContent.trim();
      const isField = s.classList.contains("blank") || s.classList.contains("proc");
      parts.push(isField ? (t || "____") : t);
    });
    // join with spaces, then tidy space before punctuation
    return parts.join(" ").replace(/\s+([,.])/g, "$1");
  }

  function shareText() {
    return statementText() + "\n\n" + HASHTAGS + "\n" + PROGRAM_URL;
  }

  // data for the facilitator view (submitted by the module script below)
  window.__cardData = function () {
    const blanks = document.querySelectorAll("#statement .blank");
    return {
      statement: statementText(),
      process: document.querySelector("#statement .proc").textContent.trim(),
      blank1: blanks[0].textContent.trim(),
      blank2: blanks[1].textContent.trim(),
      name: document.querySelector(".byline .who").textContent.trim()
    };
  };

  /* --- image export --- */
  async function renderCard() {
    card.classList.add("exporting");
    document.activeElement && document.activeElement.blur();
    try {
      // first render warms up fonts in some browsers; second is reliable
      await htmlToImage.toPng(card, { pixelRatio: 2 });
      return await htmlToImage.toPng(card, { pixelRatio: 2 });
    } finally {
      card.classList.remove("exporting");
    }
  }

  async function downloadCard(silent) {
    try {
      const dataUrl = await renderCard();
      const a = document.createElement("a");
      a.download = "my-leadership-card.png";
      a.href = dataUrl;
      a.click();
      if (!silent) showToast("Card downloaded ✓");
      return true;
    } catch (err) {
      console.error(err);
      showToast("Could not generate the image. Try again.");
      return false;
    }
  }

  document.getElementById("btn-download").addEventListener("click", () => downloadCard(false));

  /* --- social sharing, device-aware ---
     Phones/tablets: the native share sheet carries the card image itself.
     Desktop: open the pre-filled composer + download the image to attach. */
  // a real phone/tablet: touch-first device AND the share sheet accepts files.
  // (Desktop Safari/Chrome on macOS also pass the file check, so capability alone is not enough.)
  const isTouchDevice = matchMedia("(hover: none) and (pointer: coarse)").matches;
  const canShareFiles = isTouchDevice && !!(navigator.canShare &&
    navigator.canShare({ files: [new File([""], "card.png", { type: "image/png" })] }));

  async function nativeShareWithImage() {
    try {
      const dataUrl = await renderCard();
      const blob = await (await fetch(dataUrl)).blob();
      const file = new File([blob], "my-leadership-card.png", { type: "image/png" });
      await navigator.share({ files: [file], text: shareText() });
      return true;
    } catch (err) {
      if (err.name === "AbortError") return true; // user closed the sheet on purpose
      console.warn("native share failed, falling back", err);
      return false;
    }
  }

  async function socialShare(intentUrl, attachMsg, appName) {
    if (canShareFiles) {
      if (await nativeShareWithImage()) return;
    }
    const w = window.open(intentUrl, "_blank", "noopener");
    downloadCard(true);
    showToast(w ? attachMsg
                : "Popup blocked. Image downloaded — open " + appName + " and attach it.");
  }

  document.getElementById("btn-linkedin").addEventListener("click", () => {
    socialShare(
      "https://www.linkedin.com/feed/?shareActive=true&text=" + encodeURIComponent(shareText()),
      "Image downloaded. Attach it to your LinkedIn post.",
      "LinkedIn"
    );
  });

  document.getElementById("btn-x").addEventListener("click", () => {
    socialShare(
      "https://twitter.com/intent/tweet?text=" + encodeURIComponent(shareText()),
      "Image downloaded. Attach it to your post on X.",
      "X"
    );
  });

  /* --- email signature: rich text on the clipboard, ready to paste into Outlook --- */
  function escHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function signatureHTML() {
    const d = window.__cardData();
    // walk the spans so the signature follows whatever the sentence says
    const parts = [];
    document.querySelectorAll("#statement > span").forEach((el) => {
      const t = el.textContent.trim();
      const isField = el.classList.contains("blank") || el.classList.contains("proc");
      parts.push(isField
        ? (t ? '<span style="color:#005DC4;">' + escHtml(t) + "</span>" : "____")
        : escHtml(t));
    });
    const sentence = parts.join(" ").replace(/\s+([,.])/g, "$1");
    return (
      '<table cellpadding="0" cellspacing="0" border="0" style="font-family:Arial,Helvetica,sans-serif;">' +
      '<tr><td style="border-left:3px solid #005DC4;padding:4px 0 4px 14px;">' +
      '<div style="font-size:15px;line-height:1.45;color:#000A56;font-weight:bold;">&ldquo;' +
      sentence + '&rdquo;</div>' +
      (d.name ? '<div style="font-size:13px;color:#000A56;padding-top:5px;">' + escHtml(d.name) + "</div>" : "") +
      '<div style="font-size:12px;padding-top:3px;"><a href="' + PROGRAM_URL +
      '" style="color:#005DC4;text-decoration:none;">IMD / Leading in the Age of AI Sprint</a></div>' +
      "</td></tr></table>"
    );
  }

  document.getElementById("btn-signature").addEventListener("click", async () => {
    const html = signatureHTML();
    const plain = shareText();
    try {
      await navigator.clipboard.write([
        new ClipboardItem({
          "text/html": new Blob([html], { type: "text/html" }),
          "text/plain": new Blob([plain], { type: "text/plain" })
        })
      ]);
      showToast("Signature copied. In Outlook: Settings → Signatures → paste.");
    } catch (err) {
      try {
        await navigator.clipboard.writeText(plain);
        showToast("Copied as plain text. Paste it into your Outlook signature.");
      } catch (e2) {
        console.error(err, e2);
        showToast("Could not copy. Select the card text and copy it manually.");
      }
    }
  });
})();
</script>

<script type="module">
// Record cards to Firestore (if configured) so the facilitator view can show them.
// A card is recorded/updated whenever the participant downloads or shares.
if (window.FIREBASE_CONFIG) {
  try {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const { getFirestore, doc, setDoc, serverTimestamp } =
      await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    const db = getFirestore(initializeApp(window.FIREBASE_CONFIG));

    let cardId = sessionStorage.getItem("cardId");
    if (!cardId) {
      cardId = crypto.randomUUID();
      sessionStorage.setItem("cardId", cardId);
    }

    async function submitCard() {
      try {
        const data = window.__cardData();
        if (!data.process && !data.blank1 && !data.blank2 && !data.name) return; // untouched card
        await setDoc(doc(db, window.CARDS_COLLECTION, cardId), { ...data, ts: serverTimestamp() }, { merge: true });
      } catch (e) { console.warn("card submit failed", e); }
    }

    for (const id of ["btn-download", "btn-linkedin", "btn-x", "btn-signature"]) {
      document.getElementById(id).addEventListener("click", submitCard);
    }

    // auto-record while typing (debounced), so cards appear even without a click
    let t;
    document.querySelectorAll("#card [contenteditable]").forEach((el) => {
      el.addEventListener("input", () => {
        clearTimeout(t);
        t = setTimeout(submitCard, 1200);
      });
      el.addEventListener("blur", submitCard);
    });
  } catch (e) { console.warn("firebase init failed", e); }
}
</script>
